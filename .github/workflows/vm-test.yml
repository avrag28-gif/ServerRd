name: Windows RDP Maximum Performance 6H

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Inspect runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          Write-Host "=== WINDOWS ==="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          Write-Host "=== CPU ==="
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
          Write-Host "=== RAM ==="
          $cs = Get-CimInstance Win32_ComputerSystem
          Write-Host ("RAM_GB={0}" -f [math]::Round($cs.TotalPhysicalMemory / 1GB, 2))
          Write-Host "=== GPU ==="
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, VideoModeDescription, AdapterRAM, VideoProcessor, Status | Format-List
          Write-Host "=== NETWORK ==="
          Get-NetAdapter | Where-Object Status -eq "Up" | Select-Object Name, InterfaceDescription, LinkSpeed | Format-List

      - name: Apply balanced maximum-performance tuning
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          powercfg /setactive SCHEME_MIN
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          $priorityKey = "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl"
          New-Item -Path $priorityKey -Force | Out-Null
          New-ItemProperty -Path $priorityKey -Name Win32PrioritySeparation -PropertyType DWord -Value 38 -Force | Out-Null

          $services = @("DiagTrack","dmwappushservice","MapsBroker","SysMain","WSearch","Fax","RetailDemo","XblAuthManager","XblGameSave","XboxGipSvc","XboxNetApiSvc","lfsvc")
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          $processes = @("OneDrive","Teams","ms-teams","Widgets","GameBar","GameBarFTServer","YourPhone")
          foreach ($procName in $processes) {
            Get-Process -Name $procName -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

          $rdpPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $rdpPolicy -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableWallpaper -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableFullWindowDrag -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableMenuAnims -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableCursorSetting -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableCdm -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name fDisableCcm -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name UseWddmGraphicsDisplayDriver -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name UseRdpCompression -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name AVC444ModePreferred -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $rdpPolicy -Name AVCHardwareEncodePreferred -PropertyType DWord -Value 1 -Force | Out-Null
          Remove-ItemProperty -Path $rdpPolicy -Name SelectTransport -ErrorAction SilentlyContinue

          $graphicsKey = "HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers"
          Remove-ItemProperty -Path $graphicsKey -Name HwSchMode -ErrorAction SilentlyContinue

          $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item -Path $personalize -Force | Out-Null
          New-ItemProperty -Path $personalize -Name EnableTransparency -PropertyType DWord -Value 0 -Force | Out-Null
          $visual = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          New-Item -Path $visual -Force | Out-Null
          New-ItemProperty -Path $visual -Name VisualFXSetting -PropertyType DWord -Value 2 -Force | Out-Null

          $cloud = "HKCU:\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager"
          New-Item -Path $cloud -Force | Out-Null
          @("SubscribedContent-338389Enabled","SubscribedContent-338388Enabled","SilentInstalledAppsEnabled","SystemPaneSuggestionsEnabled") | ForEach-Object {
            New-ItemProperty -Path $cloud -Name $_ -PropertyType DWord -Value 0 -Force | Out-Null
          }

          Get-ChildItem "$env:TEMP\*" -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Windows\Temp\*" -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Performance tuning complete."

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw "Missing GitHub Actions secret: RDP_PASSWORD" }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue
          if ($user) {
            Set-LocalUser -Name "rdpuser" -Password $securePassword
            Enable-LocalUser -Name "rdpuser"
          } else {
            New-LocalUser -Name "rdpuser" -Password $securePassword -AccountNeverExpires -PasswordNeverExpires -Description "Temporary RDP user"
          }

          foreach ($group in @("Administrators","Remote Desktop Users")) {
            try { Add-LocalGroupMember -Group $group -Member "rdpuser" -ErrorAction Stop } catch { }
          }

          $terminalServer = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          New-ItemProperty -Path $terminalServer -Name fDenyTSConnections -PropertyType DWord -Value 0 -Force | Out-Null

          $rdpTcp = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          New-Item -Path $rdpTcp -Force | Out-Null
          New-ItemProperty -Path $rdpTcp -Name UserAuthentication -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpTcp -Name SecurityLayer -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdpTcp -Name MinEncryptionLevel -PropertyType DWord -Value 3 -Force | Out-Null

          Set-Service -Name TermService -StartupType Automatic
          if ((Get-Service -Name TermService).Status -ne "Running") { Start-Service -Name TermService }
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 3

          if (-not (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)) {
            throw "RDP port 3389 is not listening."
          }
          Get-Service TermService | Select-Object Name,Status,StartType | Format-List
          Get-NetTCPConnection -LocalPort 3389 -State Listen | Select-Object LocalAddress,LocalPort,State,OwningProcess
          Write-Host "RDP is ready."

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) { throw "Missing GitHub Actions secret: TS_AUTHKEY" }

          $installer = Join-Path $env:TEMP "tailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait

          $tailscale = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) {
            $tailscale = Join-Path $env:ProgramFiles(x86) "Tailscale\tailscale.exe"
          }
          if (-not (Test-Path $tailscale)) { throw "Tailscale executable was not found." }

          & $tailscale up --auth-key="$env:TS_AUTHKEY" --hostname="github-serverRd-${{ github.run_id }}" --accept-dns=false
          Start-Sleep -Seconds 5
          Write-Host "=== TAILSCALE IPv4 ==="
          & $tailscale ip -4
          Write-Host "=== TAILSCALE STATUS ==="
          & $tailscale status

      - name: Final RDP connectivity check
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $tailscale = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) { $tailscale = Join-Path $env:ProgramFiles(x86) "Tailscale\tailscale.exe" }

          Write-Host "=== TAILSCALE IPv4 ==="
          if (Test-Path $tailscale) { & $tailscale ip -4 }

          Write-Host "=== RDP LISTENER ==="
          Get-NetTCPConnection -LocalPort 3389 -State Listen | Select-Object LocalAddress,LocalPort,State,OwningProcess

          Write-Host "=== FIREWALL RDP ==="
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
            Where-Object Enabled -eq "True" |
            Select-Object DisplayName,Profile,Direction,Action | Format-Table -AutoSize

          Write-Host "=== CPU/RAM ==="
          $cs = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          [pscustomobject]@{
            CPU = (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
            RAM_GB = [math]::Round($cs.TotalPhysicalMemory / 1GB, 2)
            FreeRAM_GB = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
          } | Format-List

          Write-Host "=== GPU ==="
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,VideoModeDescription,Status | Format-List

      - name: Keep RDP alive for 6 hours
        shell: pwsh
        run: |
          Write-Host "ServerRd RDP is ready for 6 hours."
          Write-Host "RDP username: rdpuser"
          for ($i = 1; $i -le 360; $i++) {
            $cpuCounter = Get-Counter '\Processor(_Total)\% Processor Time' -ErrorAction SilentlyContinue
            $cpu = if ($cpuCounter) { [math]::Round($cpuCounter.CounterSamples.CookedValue,1) } else { 0 }
            $os = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
            $free = if ($os) { [math]::Round($os.FreePhysicalMemory / 1MB, 1) } else { 0 }
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP alive - minute $i/360 | CPU=$cpu% | FreeRAM=$free GB"
            Start-Sleep -Seconds 60
          }
