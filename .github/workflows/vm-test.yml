name: Windows RDP Stable Performance 6H

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Inspect runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          Write-Host "=== SYSTEM ==="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          Write-Host "=== CPU ==="
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
          Write-Host "=== RAM ==="
          $cs = Get-CimInstance Win32_ComputerSystem
          [pscustomobject]@{
            TotalGB = [math]::Round($cs.TotalPhysicalMemory / 1GB, 2)
          } | Format-List
          Write-Host "=== GPU ==="
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, VideoModeDescription, AdapterRAM, VideoProcessor, Status |
            Format-List
          Write-Host "=== NETWORK ==="
          Get-NetAdapter | Where-Object Status -eq "Up" |
            Select-Object Name, InterfaceDescription, LinkSpeed, Status |
            Format-List

      - name: Stable performance configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          powercfg /setactive SCHEME_MIN
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          $bs = [char]92

          # Restore normal Windows priority scheduling if an older run changed it.
          $priority = "HKLM:$bs" + "SYSTEM$bs" + "CurrentControlSet$bs" + "Control$bs" + "PriorityControl"
          Remove-ItemProperty -Path $priority -Name Win32PrioritySeparation -ErrorAction SilentlyContinue

          # Lightweight RDP visuals; keep Windows components and applications intact.
          $rdp = "HKLM:$bs" + "SOFTWARE$bs" + "Policies$bs" + "Microsoft$bs" + "Windows NT$bs" + "Terminal Services"
          New-Item -Path $rdp -Force | Out-Null
          New-ItemProperty -Path $rdp -Name fDisableWallpaper -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdp -Name fDisableFullWindowDrag -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdp -Name fDisableMenuAnims -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdp -Name fDisableCursorSetting -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $rdp -Name UseWddmGraphicsDisplayDriver -PropertyType DWord -Value 1 -Force | Out-Null

          Remove-ItemProperty -Path $rdp -Name UseRdpCompression -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path $rdp -Name AVC444ModePreferred -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path $rdp -Name AVCHardwareEncodePreferred -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path $rdp -Name SelectTransport -ErrorAction SilentlyContinue

          # Do not force HAGS on the virtual GPU.
          $graphics = "HKLM:$bs" + "SYSTEM$bs" + "CurrentControlSet$bs" + "Control$bs" + "GraphicsDrivers"
          Remove-ItemProperty -Path $graphics -Name HwSchMode -ErrorAction SilentlyContinue

          $personalize = "HKCU:$bs" + "Software$bs" + "Microsoft$bs" + "Windows$bs" + "CurrentVersion$bs" + "Themes$bs" + "Personalize"
          New-Item -Path $personalize -Force | Out-Null
          New-ItemProperty -Path $personalize -Name EnableTransparency -PropertyType DWord -Value 0 -Force | Out-Null

          $visual = "HKCU:$bs" + "Software$bs" + "Microsoft$bs" + "Windows$bs" + "CurrentVersion$bs" + "Explorer$bs" + "VisualEffects"
          New-Item -Path $visual -Force | Out-Null
          New-ItemProperty -Path $visual -Name VisualFXSetting -PropertyType DWord -Value 2 -Force | Out-Null

          $cloud = "HKCU:$bs" + "Software$bs" + "Microsoft$bs" + "Windows$bs" + "CurrentVersion$bs" + "ContentDeliveryManager"
          New-Item -Path $cloud -Force | Out-Null
          New-ItemProperty -Path $cloud -Name SubscribedContent-338389Enabled -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $cloud -Name SubscribedContent-338388Enabled -PropertyType DWord -Value 0 -Force | Out-Null

          Write-Host "Stable performance configuration complete."

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $bs = [char]92

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Missing GitHub Actions secret: RDP_PASSWORD"
          }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $existing = Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name "rdpuser" -Password $securePassword
          } else {
            New-LocalUser -Name "rdpuser" -Password $securePassword -AccountNeverExpires -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser" -ErrorAction SilentlyContinue

          $terminalServer = "HKLM:$bs" + "SYSTEM$bs" + "CurrentControlSet$bs" + "Control$bs" + "Terminal Server"
          Set-ItemProperty -Path $terminalServer -Name fDenyTSConnections -Value 0

          $rdpTcp = "HKLM:$bs" + "SYSTEM$bs" + "CurrentControlSet$bs" + "Control$bs" + "Terminal Server$bs" + "WinStations$bs" + "RDP-Tcp"
          Set-ItemProperty -Path $rdpTcp -Name UserAuthentication -Value 1
          Set-ItemProperty -Path $rdpTcp -Name SecurityLayer -Value 1
          Set-ItemProperty -Path $rdpTcp -Name MinEncryptionLevel -Value 3

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP configured."

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing GitHub Actions secret: TS_AUTHKEY"
          }

          $installer = Join-Path $env:TEMP "tailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait

          $tailscaleDir = Join-Path $env:ProgramFiles "Tailscale"
          $tailscale = Join-Path $tailscaleDir "tailscale.exe"
          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found."
          }

          & $tailscale up --auth-key="$env:TS_AUTHKEY" --hostname="github-serverRd-${{ github.run_id }}" --accept-dns=false

          Start-Sleep -Seconds 5

          Write-Host "=== TAILSCALE IPv4 ==="
          & $tailscale ip -4
          Write-Host "=== TAILSCALE STATUS ==="
          & $tailscale status

      - name: Verify performance state
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $bs = [char]92

          Write-Host "=== TAILSCALE PING ==="
          $tailscaleDir = Join-Path $env:ProgramFiles "Tailscale"
          $tailscale = Join-Path $tailscaleDir "tailscale.exe"
          if (Test-Path $tailscale) {
            & $tailscale ping --c 5 --timeout 3s 100.102.42.28
          }

          Write-Host "=== RDP LISTENER ==="
          Get-NetTCPConnection -LocalPort 3389 -State Listen |
            Select-Object LocalAddress,LocalPort,State,OwningProcess

          Write-Host "=== CPU/RAM ==="
          $cs = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          [pscustomobject]@{
            CPU = (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
            RAM_GB = [math]::Round($cs.TotalPhysicalMemory / 1GB, 2)
            FreeRAM_GB = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
          } | Format-List

          Write-Host "=== GPU ==="
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, VideoModeDescription, AdapterRAM, VideoProcessor, Status |
            Format-List

          Write-Host "=== RDP POLICY ==="
          $rdp = "HKLM:$bs" + "SOFTWARE$bs" + "Policies$bs" + "Microsoft$bs" + "Windows NT$bs" + "Terminal Services"
          Get-ItemProperty $rdp |
            Select-Object fDisableWallpaper,fDisableFullWindowDrag,fDisableMenuAnims,fDisableCursorSetting,UseWddmGraphicsDisplayDriver,UseRdpCompression,AVC444ModePreferred,AVCHardwareEncodePreferred,SelectTransport |
            Format-List

      - name: Keep RDP alive for 6 hours
        shell: pwsh
        run: |
          $bs = [char]92
          $counter = "$bs" + "Processor(_Total)" + $bs + "% Processor Time"

          Write-Host "ServerRd stable-performance Windows RDP is running."
          Write-Host "RDP username: rdpuser"

          for ($i = 1; $i -le 360; $i++) {
            $cpu = (Get-Counter $counter -ErrorAction SilentlyContinue).CounterSamples.CookedValue
            $os = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
            $free = if ($os) { [math]::Round($os.FreePhysicalMemory / 1MB, 1) } else { 0 }

            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP alive - minute $i/360 | CPU=$([math]::Round($cpu,1))% | FreeRAM=$free GB"
            Start-Sleep -Seconds 60
          }
